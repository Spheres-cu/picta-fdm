line-length = 120
[lint]
ignore = [
    "E402",    # module-import-not-at-top-of-file
    "E501",    # line-too-long
    "E731",    # lambda-assignment
    "E741",    # ambiguous-variable-name
    "UP031",   # printf-string-formatting
    "UP036",   # outdated-version-block
    "B006",    # mutable-argument-default
    "B008",    # function-call-in-default-argument
    "B011",    # assert-false
    "B017",    # assert-raises-exception
    "B023",    # function-uses-loop-variable (false positives)
    "B028",    # no-explicit-stacklevel
    "B904",    # raise-without-from-inside-except
    "A005",    # stdlib-module-shadowing
    "C401",    # unnecessary-generator-set
    "C402",    # unnecessary-generator-dict
    "PIE790",  # unnecessary-placeholder
    "SIM102",  # collapsible-if
    "SIM108",  # if-else-block-instead-of-if-exp
    "SIM112",  # uncapitalized-environment-variables
    "SIM113",  # enumerate-for-loop
    "SIM114",  # if-with-same-arms
    "SIM115",  # open-file-with-context-handler
    "SIM117",  # multiple-with-statements
    "SIM223",  # expr-and-false
    "SIM300",  # yoda-conditions
    "TD001",   # invalid-todo-tag
    "TD002",   # missing-todo-author
    "TD003",   # missing-todo-link
    "PLC0415", # import-outside-top-level
    "PLE0604", # invalid-all-object (false positives)
    "PLE0643", # potential-index-error (false positives)
    "PLW0603", # global-statement
    "PLW1510", # subprocess-run-without-check
    "PLW1641", # eq-without-hash
    "PLW2901", # redefined-loop-name
    "RUF001",  # ambiguous-unicode-character-string
    "RUF012",  # mutable-class-default
    "RUF100",  # unused-noqa (flake8 has slightly different behavior)
]
select = [
    "E",      # pycodestyle Error
    "W",      # pycodestyle Warning
    "F",      # Pyflakes
    "I",      # isort
    "Q",      # flake8-quotes
    "N803",   # invalid-argument-name
    "N804",   # invalid-first-argument-name-for-class-method
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "FA",     # flake8-future-annotations
    "ISC",    # flake8-implicit-str-concat
    "ICN003", # banned-import-from
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "RSE",    # flake8-raise
    "RET504", # unnecessary-assign
    "SIM",    # flake8-simplify
    "TID251", # banned-api
    "TD",     # flake8-todos
    "PLC",    # Pylint Convention
    "PLE",    # Pylint Error
    "PLW",    # Pylint Warning
    "RUF",    # Ruff-specific rules
]
[lint.per-file-ignores]
"devscripts/lazy_load_template.py" = [
    "F401",   # unused-import
]
"!picta_dl/extractor/**.py" = [
    "I",      # isort
    "ICN003", # banned-import-from
    "T20",    # flake8-print
    "A002",   # builtin-argument-shadowing
    "C408",   # unnecessary-collection-call
]
[lint.flake8-quotes]
docstring-quotes = "double"
multiline-quotes = "single"
inline-quotes = "single"
avoid-escape = false
[lint.pep8-naming]
classmethod-decorators = [
    "picta_dl.utils.classproperty",
]
[lint.flake8-import-conventions]
banned-from = [
    "base64",
    "datetime",
    "functools",
    "glob",
    "hashlib",
    "itertools",
    "json",
    "math",
    "os",
    "pathlib",
    "random",
    "re",
    "string",
    "sys",
    "time",
    "urllib.parse",
    "uuid",
    "xml",
]
[lint.flake8-tidy-imports.banned-api]
"picta_dl.compat.compat_str".msg = "Use `str` instead."
"picta_dl.compat.compat_b64decode".msg = "Use `base64.b64decode` instead."
"picta_dl.compat.compat_urlparse".msg = "Use `urllib.parse` instead."
"picta_dl.compat.compat_parse_qs".msg = "Use `urllib.parse.parse_qs` instead."
"picta_dl.compat.compat_urllib_parse_unquote".msg = "Use `urllib.parse.unquote` instead."
"picta_dl.compat.compat_urllib_parse_urlencode".msg = "Use `urllib.parse.urlencode` instead."
"picta_dl.compat.compat_urllib_parse_urlparse".msg = "Use `urllib.parse.urlparse` instead."
"picta_dl.compat.compat_shlex_quote".msg = "Use `yt_dlp.utils.shell_quote` instead."
"picta_dl.utils.error_to_compat_str".msg = "Use `str` instead."
"picta_dl.utils.bytes_to_intlist".msg = "Use `list` instead."
"picta_dl.utils.intlist_to_bytes".msg = "Use `bytes` instead."
"picta_dl.utils.jwt_encode_hs256".msg = "Use `yt_dlp.utils.jwt_encode` instead."
"picta_dl.utils.decodeArgument".msg = "Do not use"
"picta_dl.utils.decodeFilename".msg = "Do not use"
"picta_dl.utils.encodeFilename".msg = "Do not use"
"picta_dl.compat.compat_os_name".msg = "Use `os.name` instead."
"picta_dl.compat.compat_realpath".msg = "Use `os.path.realpath` instead."
"picta_dl.compat.functools".msg = "Use `functools` instead."
"picta_dl.utils.decodeOption".msg = "Do not use"
"picta_dl.utils.compiled_regex_type".msg = "Use `re.Pattern` instead."